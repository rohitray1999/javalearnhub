<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${path.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4" style="max-width: 820px;">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/paths}">Paths</a></li>
            <li class="breadcrumb-item" th:text="${path.title}">Path</li>
        </ol>
    </nav>
    <span class="badge text-bg-primary" th:text="${path.levelName}">Beginner</span>
    <h1 class="h2 mt-2" th:text="${path.title}">Path</h1>
    <p class="text-body-secondary" th:text="${path.description}">desc</p>

    <div class="d-flex align-items-center gap-3 mb-4">
        <div class="progress flex-grow-1" role="progressbar" aria-label="Path progress"
             th:attr="aria-valuenow=${percent}" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar" th:style="'width:' + ${percent} + '%'"></div>
        </div>
        <span class="small text-nowrap" th:text="${finished} + ' of ' + ${#lists.size(path.lessons)} + ' done'">0 of 4 done</span>
    </div>

    <ol class="list-group list-group-numbered">
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           th:each="l : ${path.lessons}" th:href="@{/learn/{slug}(slug=${l.slug})}">
            <span class="ms-2 me-auto">
                <span class="fw-semibold" th:text="${l.title}">Lesson</span>
                <span class="d-block small text-body-secondary" th:text="${l.summary}">summary</span>
            </span>
            <i class="bi" th:classappend="${done.contains(l.id)} ? 'bi-check-circle-fill text-success' : 'bi-circle text-body-tertiary'"></i>
        </a>
    </ol>

    <a class="btn btn-primary mt-4" th:if="${!path.lessons.isEmpty()}"
       th:href="@{/learn/{slug}(slug=${path.lessons[0].slug})}">Start this path</a>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
