<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('All lessons')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<main class="container py-4">
    <h1 class="h2 mb-1">All lessons</h1>
    <p class="text-body-secondary mb-4">Work through the stages in order, or jump to what you need.</p>

    <section class="mb-4" th:each="s : ${stages}">
        <div class="d-flex flex-wrap align-items-baseline gap-2 mb-2">
            <h2 class="h4 mb-0" th:text="${s.title}">Stage</h2>
            <span class="badge text-bg-secondary" th:text="${s.levelName}">Beginner</span>
            <span class="text-body-secondary small" th:text="${s.category}">Core Java</span>
        </div>
        <p class="text-body-secondary" th:text="${s.description}">desc</p>
        <div class="list-group">
            <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
               th:each="l : ${s.lessons}" th:href="@{/learn/{slug}(slug=${l.slug})}">
                <span>
                    <i class="bi me-2" th:classappend="${done.contains(l.id)} ? 'bi-check-circle-fill text-success' : 'bi-circle text-body-tertiary'"></i>
                    <span class="fw-semibold" th:text="${l.title}">Lesson</span>
                    <span class="d-block small text-body-secondary ms-4" th:text="${l.summary}">summary</span>
                </span>
                <span class="small text-body-secondary text-nowrap ms-3" th:text="${l.readMinutes} + ' min'">6 min</span>
            </a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
