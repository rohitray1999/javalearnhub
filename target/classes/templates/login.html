<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5" style="max-width: 440px;">
    <h1 class="h3 mb-3">Log in</h1>

    <div class="alert alert-danger" th:if="${param.error}">Email or password is incorrect.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been logged out.</div>
    <div class="alert alert-success" th:if="${param.registered}">Account created. Log in to continue.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Email</label>
            <input type="email" id="username" name="username" class="form-control" required autofocus autocomplete="username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="mt-3 text-center">New here? <a th:href="@{/register}">Create a free account</a></p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
