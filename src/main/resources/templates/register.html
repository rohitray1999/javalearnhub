<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-5" style="max-width: 440px;">
    <h1 class="h3 mb-1">Create a free account</h1>
    <p class="text-body-secondary mb-3">Track progress, keep notes and see your streak. Lessons stay free either way.</p>

    <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" th:field="*{name}" class="form-control"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" autocomplete="name">
            <div class="invalid-feedback" th:errors="*{name}">Name error</div>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" th:field="*{email}" class="form-control"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="email">
            <div class="invalid-feedback" th:errors="*{email}">Email error</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" autocomplete="new-password">
            <div class="invalid-feedback" th:errors="*{password}">Password error</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Create account</button>
    </form>
    <p class="mt-3 text-center">Already have an account? <a th:href="@{/login}">Log in</a></p>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
